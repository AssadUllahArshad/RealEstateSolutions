name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: estateflow_test
          MYSQL_USER: estateflow_test
          MYSQL_PASSWORD: ci-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: estateflow_test
      DB_USERNAME: estateflow_test
      DB_PASSWORD: ci-test-only
      CACHE_STORE: array
      SESSION_DRIVER: database
      REDIS_CLIENT: predis
      REDIS_HOST: 127.0.0.1
      RUN_REDIS_TESTS: 'true'
      E2E_PASSWORD: synthetic-ci-browser-password

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, bcmath, mbstring, fileinfo, intl, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.19.0'

      - name: Setup Application
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist
          composer check-platform-reqs
          php artisan key:generate
          npm ci
          npm run build

      - name: Run CI Checks
        run: composer ci:check

      - name: Browser tests with isolated synthetic staff
        env:
          APP_ENV: local
        run: |
          cp .env .env.e2e
          php artisan migrate --force
          php artisan db:seed --class=BrowserTestSeeder --force
          npx playwright install --with-deps chromium
          npm run test:browser
