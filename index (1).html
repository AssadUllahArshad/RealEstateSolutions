function schedule(s){let p=plan(s.plan)||db.plans[0],down=netSale(s)*p.down/100,count=p.months,installment=count? (netSale(s)-down)/count:0;let result=[{num:'Down payment',date:s.date,amount:down}];for(let i=1;i<=count;i++){let date=new Date(s.date+'T12:00:00Z');date.setUTCMonth(date.getUTCMonth()+i);result.push({num:i,date:date.toISOString().slice(0,10),amount:installment})}let received=paymentsFor(s.id);return result.map(x=>{let applied=Math.min(x.amount,Math.max(0,received));received-=applied;return {...x,paid:applied,due:Math.max(0,x.amount-applied),status:applied>=x.amount-0.01?'Paid':x.date<today?'Overdue':'Pending'}})}
function installments(){let items=visibleSales().flatMap(s=>schedule(s).map(x=>({...x,s}))),status=filters.inst||'',filtered=items.filter(x=>!status||x.status===status);return header('Installment tracker','Generated schedules, due dates, overdue balances, and collection progress.',finance()?btn('＋ Record payment','addPayment','primary'):'')+`<div class="panel"><div class="filters"><select class="selector" data-filter="inst"><option value="">All installments</option>${['Paid','Pending','Overdue'].map(x=>`<option ${status===x?'selected':''}>${x}</option>`).join('')}</select><span class="muted mini" style="align-self:center">${filtered.length} schedule entries</span></div>${table(['Customer','Plot','Installment','Due date','Expected','Allocated','Balance','Status'],filtered.slice(0,150).map(x=>`<tr><td>${esc(cust(x.s.customer)?.name)}</td><td>${esc(plot(x.s.plot)?.number)}</td><td>${esc(x.num)}</td><td>${x.date}</td><td>${money(x.amount)}</td><td>${money(x.paid)}</td><td>${money(x.due)}</td><td>${pill(x.status)}</td></tr>`))}</div>`}
function reminders(){let due=visibleSales().flatMap(s=>schedule(s).filter(x=>x.due>0).map(x=>({...x,s}))).sort((a,b)=>a.date.localeCompare(b.date)),cut=due.slice(0,25);return header('Collections & reminders','Track upcoming and missed installments and create manual reminder notes.',btn('＋ Add reminder','addReminder','primary'))+`<div class="two"><div class="panel"><h2>Priority follow-ups</h2>${table(['Customer','Due date','Balance','Status'],cut.map(x=>`<tr><td>${esc(cust(x.s.customer)?.name)}<div class="mini muted">${esc(plot(x.s.plot)?.number)}</div></td><td>${x.date}</td><td>${money(x.due)}</td><td>${pill(x.status)}</td></tr>`))}</div><div class="panel"><h2>Saved reminder notes</h2>${db.reminders.length?db.reminders.map(r=>`<div class="audit"><b>${esc(r.title)}</b><div>${esc(r.note||'')}</div><small>${esc(r.date)} • ${esc(r.customer)}</small></div>`).join(''):'<div class="empty">No reminder notes added</div>'}<div class="notice">Notifications are not automatically sent in this demo. Production delivery needs an email/SMS/WhatsApp provider, templates, and consent management.</div></div></div>`}
function payments(){return header('Cash in & cash out','Trace incoming collections and outgoing payments by party, purpose and reference.',btn('＋ Record transaction','addPayment','primary'))+`<div class="metrics"><div class="metric"><div class="k">Receipts</div><div class="v" style="font-size:22px">${money(paidTotal())}</div></div><div class="metric"><div class="k">Payouts</div><div class="v" style="font-size:22px">${money(outTotal())}</div></div><div class="metric"><div class="k">Net movement</div><div class="v" style="font-size:22px">${money(paidTotal()-outTotal())}</div></div><div class="metric"><div class="k">Transactions</div><div class="v">${db.payments.length}</div></div></div>${m('Transactions',table(['Date','ID','Type','From / To','Purpose','Linked sale','Method','Reference','Amount'],[...db.payments].reverse().map(p=>`<tr><td>${p.date}</td><td>${p.id}</td><td>${p.direction==='in'?pill('Paid'):'<span class="pill reserved">Outflow</span>'}</td><td>${esc(p.party)}</td><td>${esc(p.purpose)}</td><td>${esc(p.sale||'—')}</td><td>${esc(p.method)}</td><td>${esc(p.reference||'—')}</td><td style="color:${p.direction==='in'?'var(--green)':'var(--red)'}">${p.direction==='in'?'+':'−'}${money(p.amount)}</td></tr>`)))}`}
function ledger(){let running=0,rows=[...db.payments].sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id)).map(p=>({...p,balance:(running+=p.direction==='in'?p.amount:-p.amount)}));return header('Daily cash ledger','Chronological receipts, disbursements, and cumulative cash movement.',btn('Export CSV','exportLedger'))+m('General cashbook',table(['Date','Voucher','Particulars','Received','Paid','Running net'],rows.map(p=>`<tr><td>${p.date}</td><td>${p.id}</td><td>${esc(p.party)}<div class="muted mini">${esc(p.purpose)}</div></td><td>${p.direction==='in'?money(p.amount):'—'}</td><td>${p.direction==='out'?money(p.amount):'—'}</td><td><b>${money(p.balance)}</b></td></tr>`)))+`<div class="notice">This cashbook is not a double-entry general ledger or formal financial balance sheet. A production accounting module needs accounts, journals, reconciliation, opening balances and period controls.</div>`}
function owner(){let theoretical=db.sales.reduce((a,s)=>a+netSale(s)*(s.ownerShare||0)/100,0),settled=db.payments.filter(p=>p.direction==='out'&&p.purpose==='Owner settlement').reduce((a,p)=>a+p.amount,0);return header('Society owner settlements','Track owner revenue-share obligations and payments separately from office income.',btn('＋ Owner payout','ownerPayment','primary'))+`<div class="three section"><div class="metric"><div class="k">Owner allocation on sold value</div><div class="v" style="font-size:21px">${money(theoretical)}</div></div><div class="metric"><div class="k">Payouts made</div><div class="v" style="font-size:21px">${money(settled)}</div></div><div class="metric"><div class="k">Unsettled allocation*</div><div class="v" style="font-size:21px">${money(theoretical-settled)}</div></div></div>${m('Owner allocation per allotment',table(['Sale','Customer','Net price','Share %','Allocation'],db.sales.map(s=>`<tr><td>${s.id}</td><td>${esc(cust(s.customer)?.name)}</td><td>${money(netSale(s))}</td><td>${s.ownerShare||0}%</td><td>${money(netSale(s)*(s.ownerShare||0)/100)}</td></tr>`)))}<div class="notice">*Illustrative sales-based allocation only. Actual payable may depend on collections, contract terms, refunds, taxes and approval. Configure agreement rules before using operationally.</div>`}
function commissions(){return header('Referral commissions','Store source of referral and calculate commissions on agreed sale amounts.')+`<div class="metrics"><div class="metric"><div class="k">Estimated commissions</div><div class="v" style="font-size:23px">${money(visibleSales().reduce((a,s)=>a+netSale(s)*s.commissionRate/100,0))}</div></div><div class="metric"><div class="k">Sales with a referral</div><div class="v">${visibleSales().filter(s=>s.referrer).length}</div></div></div>${m('Referral register',table(['Sale','Customer','Referrer','Net sale','Rate','Estimated commission'],visibleSales().map(s=>`<tr><td>${s.id}</td><td>${esc(cust(s.customer)?.name)}</td><td>${esc(s.referrer||'Direct')}</td><td>${money(netSale(s))}</td><td>${s.commissionRate}%</td><td><b>${money(netSale(s)*s.commissionRate/100)}</b></td></tr>`)))}<div class="notice">Calculations are estimates. Commission approval, payable status, clawbacks and payout transactions should be handled separately in production.</div>`}
function plans(){return header('Payment plan templates','Configurable down-payment percentages and installment durations.',btn('＋ New plan','addPlan','primary'))+`<div class="three">${db.plans.map(p=>`<div class="panel"><h2>${esc(p.name)}</h2><div class="statline"><span>Down payment</span><b>${p.down}%</b></div><div class="statline"><span>Remaining term</span><b>${p.months} months</b></div><p class="sub">${p.months?'Balance is divided into '+p.months+' equal monthly installments.':'100% payable on booking.'}</p></div>`).join('')}</div>`}
function calculator(){let a=Number(filters.ca||3200000),d=Number(filters.cd||5),down=Number(filters.cp||25),months=Number(filters.cm||12),comm=Number(filters.cc||1.5),discount=a*d/100,net=a-discount,initial=net*down/100,monthly=months?(net-initial)/months:0;return header('Financial calculator','Estimate rebate, down payment, installments and referral commission without saving a sale.')+`<div class="two"><div class="panel"><h2>Calculation inputs</h2><div class="fields"><label class="field">Plot price (PKR)<input type="number" min="0" data-calc="ca" value="${a}"></label><label class="field">Rebate / discount (%)<input type="number" min="0" max="100" data-calc="cd" value="${d}"></label><label class="field">Down payment (%)<input type="number" min="0" max="100" data-calc="cp" value="${down}"></label><label class="field">Number of months<input type="number" min="0" max="120" data-calc="cm" value="${months}"></label><label class="field wide">Referral commission (%)<input type="number" min="0" max="100" data-calc="cc" value="${comm}"></label></div></div><div class="panel"><h2>Estimate</h2>${line('Original plot value',a)}${line('Rebate amount',discount)}${line('Net sale amount',net)}${line('Down payment',initial)}${line('Monthly installment',monthly)}${line('Referral commission',net*comm/100)}<p class="sub" style="margin-top:20px">Illustrative only. Actual contracts may include development charges, taxes, rounding and payment calendars.</p></div></div>`}
function team(){return header('Team & access','Demo role switching illustrates navigation and record visibility. Backend RBAC is still required.',role()==='Main Admin'?btn('＋ Add team member','addMember','primary'):'')+m('Users & assigned roles',table(['Team member','Role','Accessible scope'],db.roles.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${pill(u.role==='Main Admin'?'Active':'Reserved')} <span>${esc(u.role)}</span></td><td>${u.role==='Sales Agent'?'Own customers and sales':u.role==='Accountant'?'Finance and all customer records':'Society-wide access'}</td></tr>`)))+`<div class="callout">Main Admin: manages everything. Sub Admin: daily operations with delegated access. Accountant: finance and records. Sales Agent: assigned customers, bookings and follow-ups. In production, permissions must be checked on the server, with audit logs and society-level tenancy boundaries.</div>`}
function settings(){return header('Society configuration','Maintain configurable plot sizes, block names and society profile.')+`<div class="two"><div class="panel"><h2>Society details</h2><div class="field">Society name<input id="societyName" value="${esc(db.society)}"></div><div style="margin-top:15px">${btn('Save society name','saveSociety','primary')}</div></div><div class="panel"><h2>Plot size catalog</h2><div class="inline">${db.sizes.map(s=>`<span class="pill reserved">${s} Marla</span>`).join('')}</div><div class="inline" style="margin-top:20px"><input id="sizeInput" class="search" type="number" min="0.01" step="0.01" placeholder="New size (Marla)">${btn('Add size','addSize','primary')}</div><h2 style="margin-top:24px">Blocks</h2><div class="inline">${db.blocks.map(b=>`<span class="pill reserved">Block ${esc(b)}</span>`).join('')}</div><div class="inline" style="margin-top:15px"><input id="blockInput" class="search" placeholder="New block code">${btn('Add block','addBlock','primary')}</div></div></div><div class="panel"><h2>Demo data</h2><p class="sub">Changes are saved in this browser only. Reset discards your demo edits.</p>${btn('Reset all demo data','reset','danger')}</div>`}
function detailPlot(id){let p=plot(id);if(!p)return '';let s=db.sales.find(x=>x.plot===id);return `<div class="statline"><span>Plot</span><b>${p.number}</b></div><div class="statline"><span>Block / size</span><b>${p.block} / ${p.size} Marla</b></div>${line('List price',p.price)}<div class="statline"><span>Status</span>${pill(p.status)}</div>${s?`<div class="statline"><span>Allotted to</span><b>${esc(cust(s.customer)?.name)}</b></div>`:''}${p.status==='available'&&canSell()?`<div style="margin-top:20px">${btn('Book this plot','bookPlot:'+p.id,'primary')}</div>`:''}`}
function statement(id){let c=cust(id),ss=visibleSales().filter(s=>s.customer===id);return `<div class="callout"><b>${esc(c.name)}</b> • ${esc(c.phone)} • ${esc(c.email||'')}</div>${ss.map(s=>`<h3 style="margin-top:20px">${esc(plot(s.plot)?.number)} — ${s.id}</h3>${line('Price after discount',netSale(s))}${line('Collections',paymentsFor(s.id))}${line('Balance due',remaining(s))}${table(['Date','Transaction','Amount'],db.payments.filter(p=>p.sale===s.id).map(p=>`<tr><td>${p.date}</td><td>${esc(p.purpose)}</td><td>${money(p.amount)}</td></tr>`))}`).join('')||'<p>No allotments yet.</p>'}`}
const field=(label,name,type='text',value='',extra='')=>`<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra} required></label>`,select=(label,name,options)=>`<label class="field">${label}<select name="${name}" ${name==='sale'?'':'required'}>${options.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}</select></label>`;function modalForm(kind,payload){let f='',title='',submit='Save';if(kind==='addPlot'){title='Add a plot';f=field('Plot number','number')+select('Block','block',db.blocks.map(b=>[b,'Block '+b]))+select('Size','size',db.sizes.map(s=>[s,s+' Marla']))+field('List price (PKR)','price','number','','min="1"')}
if(kind==='addCustomer'){title='New customer';f=field('Full name','name')+field('Mobile','phone')+field('CNIC / ID','cnic')+field('Email','email','email')+(admin()?select('Assigned sales member','agent',db.roles.filter(u=>u.role==='Sales Agent').map(u=>[u.id,u.name])):'')}
if(kind==='booking'){title='New plot booking';let available=db.plots.filter(p=>p.status==='available');if(!available.length)return '<p>No available plots.</p>';let clients=visibleCustomers();if(!clients.length)return '<p>Add a customer first.</p>';f=select('Customer','customer',clients.map(c=>[c.id,c.name]))+select('Available plot','plot',available.map(p=>[p.id,p.number+' • '+p.size+' Marla • '+money(p.price)]))+select('Payment plan','plan',db.plans.map(p=>[p.id,p.name]))+field('Rebate / discount (PKR)','discount','number',0,'min="0"')+field('Referral name (optional)','referrer','text','','')+field('Referral commission (%)','commissionRate','number',0,'min="0" max="100" step="0.01"')+field('Owner share (%)','ownerShare','number',65,'min="0" max="100"')}
if(kind==='addPayment'||kind==='ownerPayment'){title=kind==='ownerPayment'?'Record owner settlement':'Record payment / payout';f=select('Direction','direction',kind==='ownerPayment'?[['out','Money sent']]:[['in','Money received'],['out','Money sent']])+field('Amount (PKR)','amount','number','','min="1"')+field('Date','date','date',today)+field('From / to','party','text',kind==='ownerPayment'?'Society Owner':'')+field('Purpose','purpose','text',kind==='ownerPayment'?'Owner settlement':'')+select('Method','method',[['Bank Transfer','Bank Transfer'],['Cash','Cash'],['Cheque','Cheque'],['Other','Other']])+field('Reference number','reference','text')+select('Linked sale (optional)','sale',[['','No linked sale'],...db.sales.map(s=>[s.id,s.id+' — '+cust(s.customer)?.name])])}
if(kind==='addPlan'){title='Create payment plan';f=field('Plan name','name')+field('Down payment (%)','down','number',25,'min="0" max="100"')+field('Number of monthly installments','months','number',12,'min="0" max="120"')}
if(kind==='addReminder'){title='New reminder note';f=field('Title','title')+field('Customer / contact','customer')+field('Follow-up date','date','date',today)+`<label class="field wide">Notes<textarea name="note" rows="3"></textarea></label>`}
if(kind==='addMember'){title='New team member';f=field('Team member name','name')+select('Role','role',[['Sub Admin','Sub Admin'],['Sales Agent','Sales Agent'],['Accountant','Accountant']])}
return `<form id="dataForm" data-kind="${kind}"><div class="fields">${f}</div><div class="modal-actions">${btn('Cancel','close') }<button class="btn primary" type="submit">${submit}</button></div></form>`}
function openModal(title,body){document.getElementById('modalRoot').innerHTML=`<div class="modal-back" data-act="closeBackdrop"><div class="modal" onclick="event.stopPropagation()"><div class="panel-head"><h2>${title}</h2>${btn('✕','close','small')}</div>${body}</div></div>`}function close(){document.getElementById('modalRoot').innerHTML=''}function doForm(form){let kind=form.dataset.kind,v=Object.fromEntries(new FormData(form));if(kind==='addPlot'){if(db.plots.some(p=>p.number.toLowerCase()===v.number.trim().toLowerCase()))return alertMsg('Plot number already exists');db.plots.push({id:uid('PL',db.plots),number:v.number.trim(),block:v.block,size:+v.size,price:+v.price,status:'available'});log('Plot added: '+v.number)}if(kind==='addCustomer'){db.customers.push({...v,id:uid('C',db.customers),agent:admin()?v.agent:currentUser});log('Customer created: '+v.name)}if(kind==='booking'){let p=plot(v.plot);if(!p||p.status!=='available')return alertMsg('Plot is no longer available');if(+v.discount<0||+v.discount>=p.price)return alertMsg('Invalid discount');let s={id:uid('S',db.sales),customer:v.customer,plot:v.plot,date:today,price:p.price,discount:+v.discount,plan:v.plan,agent:currentUser,referrer:v.referrer,commissionRate:+v.commissionRate,ownerShare:+v.ownerShare};db.sales.push(s);p.status='booked';log('Booking created: '+s.id+' for '+p.number)}if(kind==='addPayment'||kind==='ownerPayment'){if(+v.amount<=0)return alertMsg('Invalid amount');if(v.direction==='in'&&v.sale&&sale(v.sale)&&+v.amount>remaining(sale(v.sale))+0.01)return alertMsg('Amount exceeds sale outstanding balance');db.payments.push({...v,id:uid('P',db.payments),amount:+v.amount,sale:v.sale||null});log('Transaction recorded: '+v.purpose+' '+money(+v.amount));if(v.direction==='in'&&v.sale&&remaining(sale(v.sale))===0)plot(sale(v.sale).plot).status='sold'}if(kind==='addPlan'){if(+v.down<0||+v.down>100||(+v.months===0&&+v.down!==100))return alertMsg('Check plan percentages');db.plans.push({id:uid('PLAN',db.plans),name:v.name,down:+v.down,months:+v.months});log('Payment plan created: '+v.name)}if(kind==='addReminder'){db.reminders.push(v);log('Reminder note created: '+v.title)}if(kind==='addMember'){db.roles.push({...v,id:uid('u',db.roles)});log('Team member created: '+v.name)}save();close();render();alertMsg('Saved successfully')}
function downloadCSV(){let rows=[['Date','Transaction','Direction','Party','Purpose','Sale','Method','Reference','Amount'],...db.payments.map(p=>[p.date,p.id,p.direction,p.party,p.purpose,p.sale||'',p.method,p.reference,p.amount])];let csv=rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='estateflow-ledger.csv';a.click();URL.revokeObjectURL(a.href)}
function action(a){if(a==='close'||a==='closeBackdrop'){close();return}if(a.startsWith('go:')){view=a.split(':')[1];filters={};render();return}if(a.startsWith('block:')){filters.block=a.split(':')[1];render();return}if(a.startsWith('plot:')){let id=a.split(':')[1];openModal('Plot details',detailPlot(id));return}if(a.startsWith('customer:')){openModal('Customer statement',statement(a.split(':')[1]));return}if(a.startsWith('sale:')){let s=sale(a.split(':')[1]);openModal('Allotment details',`<div class="statline"><span>Customer</span><b>${esc(cust(s.customer)?.name)}</b></div><div class="statline"><span>Plot</span><b>${esc(plot(s.plot)?.number)}</b></div><div class="statline"><span>Payment plan</span><b>${esc(plan(s.plan)?.name)}</b></div>${line('Net value',netSale(s))}${line('Received',paymentsFor(s.id))}${line('Balance due',remaining(s))}<div class="statline"><span>Referral source</span><b>${esc(s.referrer||'Direct')}</b></div>`);return}if(a.startsWith('bookPlot:')){filters.prefill=a.split(':')[1];a='booking'}if(['addPlot','addCustomer','booking','addPayment','ownerPayment','addPlan','addReminder','addMember'].includes(a)){if(a==='booking'&&!canSell())return alertMsg('No permission');if(['addPayment','ownerPayment'].includes(a)&&!finance())return alertMsg('No permission');let titles={addPlot:'Add a plot',addCustomer:'New customer',booking:'Create booking',addPayment:'Record transaction',ownerPayment:'Owner payout',addPlan:'New plan',addReminder:'Add reminder',addMember:'New team member'};openModal(titles[a],modalForm(a));if(a==='booking'&&filters.prefill){let el=document.querySelector('[name="plot"]');if(el)el.value=filters.prefill;delete filters.prefill}return}if(a==='exportLedger'){downloadCSV();return}if(a==='saveSociety'){db.society=document.getElementById('societyName').value.trim()||db.society;log('Society renamed');render();alertMsg('Saved');return}if(a==='addSize'){let n=Number(document.getElementById('sizeInput').value);if(n<=0||db.sizes.includes(n))return alertMsg('Enter a new positive size');db.sizes.push(n);db.sizes.sort((x,y)=>x-y);log('Plot size added: '+n);render();return}if(a==='addBlock'){let b=document.getElementById('blockInput').value.trim().toUpperCase();if(!b||db.blocks.includes(b))return alertMsg('Enter a new block code');db.blocks.push(b);log('Block created: '+b);render();return}if(a==='reset'){if(confirm('Reset all browser demo data?')){db=seed();save();view='dashboard';filters={};render()}return}}
const pages={dashboard,inventory,map,customers,sales,installments,reminders,payments,ledger,owner,commissions,plans,calculator,team,settings};function render(){if(restricted(view))view='dashboard';let content=pages[view]();let name=nav.flatMap(g=>g[1]).find(n=>n[0]===view)?.[2];document.getElementById('app').innerHTML=`<div class="shell"><aside id="sidebar" class="sidebar"><div class="brand">Estate<span>Flow</span><small class="tagline">SOCIETY MANAGEMENT</small></div><div style="padding:0 10px;color:#d3e0f3;font-size:12px">${esc(db.society)}</div>${nav.map(([group,items])=>`<div class="group">${group}</div>${items.filter(x=>!restricted(x[0])).map(([id,ico,title])=>`<button class="nav ${view===id?'active':''}" data-nav="${id}"><span class="sym">${ico}</span>${title}</button>`).join('')}`).join('')}<div class="sidebar-foot">● Demo environment<br><span style="color:#7d8da9">Data stored in this browser</span></div></aside><div class="main"><div class="top"><div class="inline"><button class="btn mobilemenu" data-act="menu">☰</button><span class="crumb">Green Valley / <b>${esc(name)}</b></span></div><div class="topright"><span class="muted mini">View as</span><select class="selector" id="switchUser">${db.roles.map(u=>`<option value="${u.id}" ${u.id===currentUser?'selected':''}>${esc(u.name)} (${esc(u.role)})</option>`).join('')}</select><div class="avatar">${esc(user().name.slice(0,2).toUpperCase())}</div></div></div><main class="content">${content}<div class="sub" style="margin:22px 0">EstateFlow clickable prototype • Sample Pakistan Rupee data • No real bank, SMS, authorization, or accounting integration</div></main></div></div><div id="modalRoot"></div>`}
document.addEventListener('click',e=>{let el=e.target.closest('[data-act],[data-nav]');if(!el)return;if(el.dataset.nav){view=el.dataset.nav;filters={};render();return}if(el.dataset.act==='menu'){document.getElementById('sidebar').classList.toggle('open');return}action(el.dataset.act)});document.addEventListener('change',e=>{if(e.target.id==='switchUser'){currentUser=e.target.value;filters={};render()}if(e.target.dataset.filter){filters[e.target.dataset.filter]=e.target.value;render()}if(e.target.dataset.calc){filters[e.target.dataset.calc]=e.target.value;render()}});document.addEventListener('input',e=>{if(e.target.dataset.filter==='q'){let cursor=e.target.selectionStart;filters.q=e.target.value;render();let x=document.querySelector('[data-filter="q"]');x?.focus();x?.setSelectionRange(cursor,cursor)}});document.addEventListener('submit',e=>{if(e.target.id==='dataForm'){e.preventDefault();doForm(e.target)}});render();
</script></body></html>
